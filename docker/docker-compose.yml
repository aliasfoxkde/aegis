# =============================================================================
# Aegis Security Scanner - Docker Compose Configuration
# =============================================================================
#
# The CLI exits 1 when findings are reported and 0 on a clean scan; there
# is no separate "exit on findings" switch. Output format and profile are
# plain flags. RUST_LOG is the only environment variable the binaries
# read for behavior (the daemon additionally reads AEGIS_DAEMON_SOCKET_PATH
# and AEGIS_DAEMON_SCAN_ROOT, but it is a local Unix-socket server and is
# not included here as a networked service).
#
# Usage:
#   Scan current directory:  docker compose --profile default run --rm aegis
#   JSON output:             docker compose --profile json run --rm aegis
#   SARIF for CI:            docker compose --profile ci run --rm aegis
#   Interactive shell:       docker compose run --rm -it aegis /bin/bash

services:
  # Human-readable scan of the checkout (read-only mount).
  aegis:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: aegis:latest
    container_name: aegis-scanner
    profiles:
      - default
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace
    environment:
      - RUST_LOG=info
    command: scan /workspace

  # JSON output for downstream tooling.
  aegis-json:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: aegis:latest
    profiles:
      - json
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace
    environment:
      - RUST_LOG=info
    command: --format json scan /workspace

  # CI/CD mode: the shipped pipeline profile (SARIF output written next to
  # the checkout; the container exits 1 when findings survive the
  # profile's filters).
  aegis-ci:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: aegis:latest
    profiles:
      - ci
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace
    environment:
      - RUST_LOG=warn
    command: --format sarif scan /workspace -c /etc/aegis/profiles/pipeline.json --output-file /workspace/aegis-results.sarif
