[package]
name = "aegis-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core scanning engine for Aegis"
categories = ["command-line-utilities", "development-tools", "security"]
keywords = ["security", "scanning", "pattern-matching", "secrets-detection"]

[dependencies]
regex = { workspace = true }
regex-syntax = { workspace = true }
lazy_static = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["sync", "fs", "io-util", "rt"], optional = true }
tracing = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
miette = { workspace = true }
flate2 = { workspace = true }
jsonschema = { workspace = true, optional = true }

# Parallel processing
rayon = "1.10"
parking_lot = "0.12"

# Glob patterns
glob = "0.3"

# Ignore files
ignore = "0.4"

# Walking directories
walkdir = "2.5"

# Diffs
similar = "3.1"
indicatif = { workspace = true }

# Time
time = { version = "0.3", features = ["formatting"] }

# Env variables
env_logger = "0.11"

# Directories
dirs = "6.0"

# Output pipeline dependencies
reqwest = { version = "0.12", features = ["json", "blocking"], optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
csv = "1.3"

# Preset configuration
serde_yaml = "0.9"

# Tree-sitter integration (optional, for deep AST analysis)
tree-sitter = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tempfile = "3.10"
pretty_assertions = "1.4"

[features]
default = ["tokio", "jsonschema"]
tokio = ["dep:tokio"]
jsonschema = ["dep:jsonschema"]
output-pipeline = ["dep:reqwest", "dep:rusqlite"]
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-go", "dep:tree-sitter-rust", "dep:tree-sitter-python", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript"]
