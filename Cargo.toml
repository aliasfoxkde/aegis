[package]
name = "aegis"
version.workspace = true
edition = "2021"
authors = ["Aegis Team"]
license = "Apache-2.0"
repository = "https://github.com/aegis/aegis"
description = "Aegis - Security scanning for DevOps and CI/CD"

[[bin]]
name = "aegis-bootstrap"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-cli",
    "crates/aegis-mcp",
    "crates/aegis-daemon",
    "crates/aegis-bundler",
    "crates/aegis-patterns",
    "crates/aegis-wasm",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.6.2"
edition = "2021"
authors = ["Aegis Team"]
license = "Apache-2.0"
repository = "https://github.com/aegis/aegis"
rust-version = "1.88"

# Strict-but-practical lint baseline. Every member crate opts in with
# `[lints] workspace = true`; CI runs clippy with `-D warnings`, so all of
# these are errors in practice.
[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
let_underscore_drop = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_qualifications = "warn"
missing_docs = "warn"

# Rustdoc lints only fire under `cargo doc`, which CI runs as its own
# gate; keep every published doc link resolvable.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Unwinding panics are denied in production code: errors must be values.
# The few deliberate exceptions carry an inline `#[allow]` with the
# invariant it protects (static regexes, epoch arithmetic, documented
# panicking convenience constructors). Test code is exempt via
# clippy.toml's allow-…-in-tests flags.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Throughput and score math intentionally narrows counters to f64; precision
# past the 52-bit mantissa is irrelevant for reported metrics.
cast_precision_loss = "allow"
# Backtick styling and function-length opinions are review concerns, not
# build gates.
doc_markdown = "allow"
too_many_lines = "allow"

[workspace.dependencies]
# Core dependencies
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Compression
flate2 = "1.0"

# Hashing
sha2 = "0.11"
hex = "0.4"

# Utilities
walkdir = "2.5"
rayon = "1.10"
parking_lot = "0.12"
glob = "0.3"
ignore = "0.4"
similar = "3.1"
time = { version = "0.3", features = ["formatting"] }
dirs = "7.0"
serde_yaml = "0.9"

# Property-based testing
proptest = "1.5"
criterion = { version = "0.8", features = ["html_reports"] }

# Test utilities
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
pretty_assertions = "1.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# The WASM artifact optimizes for download size, not speed. Profiles are
# only valid in the workspace root, so this lives here (a crate-level
# [profile.release] would be silently ignored).
[profile.release.package.aegis-wasm]
opt-level = "s"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package.aegis-core]
opt-level = 0

[package.metadata.cargo-machete]
ignored = []
