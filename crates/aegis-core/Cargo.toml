[package]
name = "aegis-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core scanning engine for Aegis"
categories = ["command-line-utilities", "development-tools", "security"]
keywords = ["security", "scanning", "pattern-matching", "secrets-detection"]

[dependencies]
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "fs", "io-util", "rt", "macros"], optional = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }

# Parallel processing
rayon = "1.10"
parking_lot = "0.12"

# Glob patterns
glob = "0.3"

# Ignore files

# Walking directories
walkdir = "2.5"

# Diffs

# Time

# Directories
dirs = "7.0"

# Preset configuration
serde_yaml = "0.9"

# Tree-sitter integration (optional, for deep AST analysis)
tree-sitter = { version = "0.27", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
aegis-patterns = { path = "../aegis-patterns" }
tempfile = "3.10"
pretty_assertions = "1.4"

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-go", "dep:tree-sitter-rust", "dep:tree-sitter-python", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript"]

[[bench]]
name = "pattern_matching"
harness = false

[[bench]]
name = "scanner_init"
harness = false

[[bench]]
name = "clone_detection"
harness = false

[lints]
workspace = true
