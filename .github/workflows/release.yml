name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Test before building
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run fmt check
        run: cargo fmt --all -- --check

  # Linux build
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release
      - name: Generate checksums
        run: |
          cd target/release
          sha256sum aegis > aegis-x86_64-unknown-linux-gnu.tar.gz.sha256
          sha256sum aegis-mcp >> aegis-x86_64-unknown-linux-gnu.tar.gz.sha256
          sha256sum aegis-daemon >> aegis-x86_64-unknown-linux-gnu.tar.gz.sha256
          sha256sum aegis-bundler >> aegis-x86_64-unknown-linux-gnu.tar.gz.sha256
      - name: Package
        run: |
          cd target/release
          tar -czf aegis-x86_64-unknown-linux-gnu.tar.gz aegis aegis-mcp aegis-daemon aegis-bundler
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-linux
          path: |
            target/release/aegis-x86_64-unknown-linux-gnu.tar.gz
            target/release/aegis-x86_64-unknown-linux-gnu.tar.gz.sha256

  # macOS x86_64
  macos-x86:
    name: macOS x86_64
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release
      - name: Generate checksum
        run: shasum -a 256 target/release/aegis > aegis-x86_64-apple-darwin.tar.gz.sha256
      - name: Package
        run: |
          tar -czf aegis-x86_64-apple-darwin.tar.gz -C target/release aegis
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-macos-x86
          path: |
            aegis-x86_64-apple-darwin.tar.gz
            aegis-x86_64-apple-darwin.tar.gz.sha256

  # macOS ARM64 (Apple Silicon)
  macos-arm:
    name: macOS ARM64
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release --target aarch64-apple-darwin
      - name: Generate checksum
        run: shasum -a 256 target/aarch64-apple-darwin/release/aegis > aegis-aarch64-apple-darwin.tar.gz.sha256
      - name: Package
        run: |
          tar -czf aegis-aarch64-apple-darwin.tar.gz -C target/aarch64-apple-darwin/release aegis
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-macos-arm
          path: |
            aegis-aarch64-apple-darwin.tar.gz
            aegis-aarch64-apple-darwin.tar.gz.sha256

  # Windows x86_64
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release
      - name: Generate checksum
        shell: bash
        run: |
          certutil -hashfile target/release/aegis.exe SHA256 | grep -v ":" | tr -d ' ' > aegis-x86_64-pc-windows-gnu.tar.gz.sha256
      - name: Package
        shell: bash
        run: |
          tar -czf aegis-x86_64-pc-windows-gnu.tar.gz -C target/release aegis.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-windows
          path: |
            aegis-x86_64-pc-windows-gnu.tar.gz
            aegis-x86_64-pc-windows-gnu.tar.gz.sha256

  # Create release with all assets
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [linux, macos-x86, macos-arm, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: 'aegis-*'
          merge-multiple: true
      - name: Display structure
        run: ls -la release/
      - name: Verify checksums
        run: |
          echo "Verifying checksums..."
          cd release
          for file in *.tar.gz; do
            echo "Checking $file..."
            if [[ "$file" == *windows* ]]; then
              # Windows certutil outputs differently
              expected=$(cat "${file}.sha256" | awk '{print $1}')
              actual=$(certutil -hashfile "$file" SHA256 | grep -v ":" | tr -d ' ')
            elif [[ "$file" == *darwin* ]]; then
              expected=$(cat "${file}.sha256" | awk '{print $1}')
              actual=$(shasum -a 256 "$file" | awk '{print $1}')
            else
              expected=$(cat "${file}.sha256" | awk '{print $1}')
              actual=$(sha256sum "$file" | awk '{print $1}')
            fi
            if [ "$expected" = "$actual" ]; then
              echo "  ✓ $file checksum verified"
            else
              echo "  ✗ $file checksum mismatch!"
              echo "  Expected: $expected"
              echo "  Actual:   $actual"
              exit 1
            fi
          done
          echo "All checksums verified!"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
