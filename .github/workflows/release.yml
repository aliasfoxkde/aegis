name: Release

# Since v0.6.1 releases are built by the GitForge release lane
# (.gitforce.yml -> ci/release/Dockerfile) and published from the lane
# artifacts by scripts/release/publish_github_release.sh; GitHub is the
# sharing mirror, not the build path. This workflow stays as a manual
# fallback rebuild on GitHub infrastructure and no longer fires on tag
# pushes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.6.1)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

# Read-only by default; only `create-release` elevates to contents: write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Test before building
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests
        run: cargo test --workspace
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run fmt check
        run: cargo fmt --all -- --check

  # Source code
  source:
    name: Source Code
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create source archive
        run: |
          git archive --format=zip --prefix=aegis-${{ github.ref_name }}/ -o source.zip HEAD
          git archive --format=tar.gz --prefix=aegis-${{ github.ref_name }}/ -o source.tar.gz HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: |
            source.zip
            source.tar.gz

  # Linux x86_64
  linux-amd64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --workspace --release
      - name: Package binaries
        run: tar -czf target/release/aegis-linux-x86_64.tar.gz -C target/release aegis aegis-mcp aegis-daemon aegis-bundler
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-amd64
          path: |
            target/release/aegis-linux-x86_64.tar.gz

  # Linux ARM64
  linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - name: Install cross-compilation tools
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Set up cross-compilation environment
        run: echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --workspace --release --target aarch64-unknown-linux-gnu
      - name: Package binaries
        run: tar -czf target/aarch64-unknown-linux-gnu/release/aegis-linux-arm64.tar.gz -C target/aarch64-unknown-linux-gnu/release aegis aegis-mcp aegis-daemon aegis-bundler
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-arm64
          path: |
            target/aarch64-unknown-linux-gnu/release/aegis-linux-arm64.tar.gz

  # macOS x86_64
  macos-x86:
    name: macOS x86_64
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --workspace --release
      - name: Package binaries
        run: tar -czf target/release/aegis-darwin-x86_64.tar.gz -C target/release aegis aegis-mcp aegis-daemon aegis-bundler
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-x86
          path: |
            target/release/aegis-darwin-x86_64.tar.gz

  # macOS ARM64 (Apple Silicon)
  macos-arm:
    name: macOS ARM64
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --workspace --release --target aarch64-apple-darwin
      - name: Package binaries
        run: tar -czf target/aarch64-apple-darwin/release/aegis-darwin-arm64.tar.gz -C target/aarch64-apple-darwin/release aegis aegis-mcp aegis-daemon aegis-bundler
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm
          path: |
            target/aarch64-apple-darwin/release/aegis-darwin-arm64.tar.gz

  # Windows x86_64
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --workspace --release
      - name: Package binaries
        shell: bash
        run: |-
          tar -czf target/release/aegis-windows-x86_64.tar.gz -C target/release aegis.exe aegis-mcp.exe aegis-daemon.exe aegis-bundler.exe  # aegis:ignore:executable-file-upload
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: |
            target/release/aegis-windows-x86_64.tar.gz

  # WASM build
  wasm:
    name: WASM
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --package aegis-wasm
      - name: Rename to release asset name
        run: cp target/wasm32-unknown-unknown/release/aegis_wasm.wasm aegis-wasm.wasm
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm
          path: |
            aegis-wasm.wasm

  # Create release with all assets
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [linux-amd64, linux-arm64, macos-x86, macos-arm, windows, wasm, source]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Display structure
        run: ls -la release/
      - name: Create checksums file
        # Checksum the exact archives users download, in standard
        # `sha256sum -c` format. Per-platform checksum files were removed:
        # they hashed unpacked binaries, and the Windows variant stripped
        # filenames, so whichever artifact merged last silently won.
        run: |
          cd release
          rm -f checksums.txt
          sha256sum -- *.tar.gz *.wasm *.zip > checksums.txt
          cat checksums.txt
      - name: Ensure mutable release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              gh release delete "$tag" --repo "${{ github.repository }}" --yes
              for attempt in $(seq 1 30); do
                if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
                echo "release $tag is still visible after deletion; refusing to create a duplicate"
                exit 1
              fi
            fi
          fi
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${{ github.repository }}" --verify-tag --draft --title "Aegis $tag" --generate-notes
          fi
      - name: Create Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          # Upload assets while the release is mutable. GitHub rejects asset
          # uploads after a published release becomes immutable.
          draft: true
          prerelease: false
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release after assets upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          assets="$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '[.assets[].name] | sort | join("\n")')"
          for asset in \
            aegis-darwin-arm64.tar.gz \
            aegis-darwin-x86_64.tar.gz \
            aegis-linux-arm64.tar.gz \
            aegis-linux-x86_64.tar.gz \
            aegis-windows-x86_64.tar.gz \
            aegis-wasm.wasm \
            checksums.txt \
            source.tar.gz \
            source.zip; do
            if ! grep -Fqx -- "$asset" <<<"$assets"; then
              echo "missing release asset: $asset"
              exit 1
            fi
          done
          is_draft="$(gh release view "$tag" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" = "true" ]; then
            gh release edit "$tag" --repo "${{ github.repository }}" --draft=false
          else
            echo "release $tag is already published with all expected assets"
          fi
