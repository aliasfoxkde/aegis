[package]
name = "aegis"
version = "0.2.2"
edition = "2021"
authors = ["Aegis Team"]
license = "Apache-2.0"
repository = "https://github.com/aegis/aegis"
description = "Aegis - Security scanning for DevOps and CI/CD"

[[bin]]
name = "aegis-bootstrap"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-cli",
    "crates/aegis-mcp",
    "crates/aegis-daemon",
    "crates/aegis-bundler",
    "crates/aegis-patterns",
    "crates/aegis-wasm",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
authors = ["Aegis Team"]
license = "Apache-2.0"
repository = "https://github.com/aegis/aegis"
rust-version = "1.75"

[workspace.dependencies]
# Core dependencies
regex = "1.10"
regex-syntax = "0.8"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async
futures = "0.3"
async-trait = "0.1"

# Serialization
bincode = "1.3"
flate2 = "1.0"

# Hashing
sha2 = "0.11"
hex = "0.4"

# Error handling
miette = { version = "7.6", features = ["serde"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
colored = "3.1"
indicatif = "0.18"

# Utilities
walkdir = "2.5"
rayon = "1.10"
parking_lot = "0.12"
glob = "0.3"
ignore = "0.4"
similar = "3.1"
time = { version = "0.3", features = ["formatting"] }
env_logger = "0.11"
atty = "0.2"
dirs = "6.0"
serde_yaml = "0.9"
nix = "0.31"
ratelimit = "2.0"

# HTTP client (for bundle download)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# JSON Schema
jsonschema = "0.49"

# Property-based testing
proptest = "1.5"
criterion = { version = "0.8", features = ["html_reports"] }

# Test utilities
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
pretty_assertions = "1.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package.aegis-core]
opt-level = 0

[package.metadata.cargo-machete]
ignored = ["lazy_static"]
