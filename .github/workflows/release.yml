name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Test before building
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run fmt check
        run: cargo fmt --all -- --check

  # Source code
  source:
    name: Source Code
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          git archive --format=zip --prefix=aegis-${{ github.ref_name }}/ -o source.zip HEAD
          git archive --format=tar.gz --prefix=aegis-${{ github.ref_name }}/ -o source.tar.gz HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            source.zip
            source.tar.gz

  # Linux x86_64
  linux-amd64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release
      - name: Generate checksums
        run: |
          cd target/release
          sha256sum aegis aegis-mcp aegis-daemon aegis-bundler > checksums.txt
          tar -czf aegis-linux-x86_64.tar.gz aegis aegis-mcp aegis-daemon aegis-bundler
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            target/release/aegis-linux-x86_64.tar.gz
            target/release/checksums.txt

  # Linux ARM64
  linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross-compilation tools
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Set up cross-compilation environment
        run: echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> $GITHUB_ENV
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release --target aarch64-unknown-linux-gnu
      - name: Generate checksums
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          sha256sum aegis aegis-mcp aegis-daemon aegis-bundler > checksums.txt
          tar -czf aegis-linux-arm64.tar.gz aegis aegis-mcp aegis-daemon aegis-bundler
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            target/aarch64-unknown-linux-gnu/release/aegis-linux-arm64.tar.gz
            target/aarch64-unknown-linux-gnu/release/checksums.txt

  # macOS x86_64
  macos-x86:
    name: macOS x86_64
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release
      - name: Generate checksums
        run: |
          cd target/release
          shasum -a 256 aegis aegis-mcp aegis-daemon aegis-bundler > checksums.txt
          tar -czf aegis-darwin-x86_64.tar.gz aegis aegis-mcp aegis-daemon aegis-bundler
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86
          path: |
            target/release/aegis-darwin-x86_64.tar.gz
            target/release/checksums.txt

  # macOS ARM64 (Apple Silicon)
  macos-arm:
    name: macOS ARM64
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release --target aarch64-apple-darwin
      - name: Generate checksums
        run: |
          cd target/aarch64-apple-darwin/release
          shasum -a 256 aegis aegis-mcp aegis-daemon aegis-bundler > checksums.txt
          tar -czf aegis-darwin-arm64.tar.gz aegis aegis-mcp aegis-daemon aegis-bundler
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm
          path: |
            target/aarch64-apple-darwin/release/aegis-darwin-arm64.tar.gz
            target/aarch64-apple-darwin/release/checksums.txt

  # Windows x86_64
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release
      - name: Generate checksums
        shell: bash
        run: |
          cd target/release
          certutil -hashfile aegis.exe SHA256 | grep -v ":" | tr -d ' ' > checksums.txt
          certutil -hashfile aegis-mcp.exe SHA256 | grep -v ":" | tr -d ' ' >> checksums.txt
          certutil -hashfile aegis-daemon.exe SHA256 | grep -v ":" | tr -d ' ' >> checksums.txt
          certutil -hashfile aegis-bundler.exe SHA256 | grep -v ":" | tr -d ' ' >> checksums.txt
          tar -czf aegis-windows-x86_64.tar.gz aegis.exe aegis-mcp.exe aegis-daemon.exe aegis-bundler.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/aegis-windows-x86_64.tar.gz
            target/release/checksums.txt

  # WASM build
  wasm:
    name: WASM
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --package aegis-wasm
      - name: Generate checksums
        run: |
          cd target/wasm32-unknown-unknown/release
          sha256sum aegis_wasm.wasm > checksums.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            target/wasm32-unknown-unknown/release/aegis_wasm.wasm
            target/wasm32-unknown-unknown/release/checksums.txt

  # Create release with all assets
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [linux-amd64, linux-arm64, macos-x86, macos-arm, windows, wasm, source]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Display structure
        run: ls -la release/
      - name: Create checksums file
        run: |
          (cat release/checksums.txt 2>/dev/null; cat release/*/checksums.txt 2>/dev/null; cat release/*/*/checksums.txt 2>/dev/null) > release/all_checksums.txt || cat release/checksums.txt > release/all_checksums.txt 2>/dev/null || true
          mv release/all_checksums.txt release/checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
