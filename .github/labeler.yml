# Labeler configuration
# https://github.com/actions/labeler

documentation:
  - any-glob:
      - 'docs/**'
      - '**.md'

ci-cd:
  - any-glob:
      - '.github/workflows/**'
      - '.github/*.yml'

detection-patterns:
  - any-glob:
      - 'crates/aegis-patterns/**'

core:
  - any-glob:
      - 'crates/aegis-core/**'

cli:
  - any-glob:
      - 'crates/aegis-cli/**'

mcp:
  - any-glob:
      - 'crates/aegis-mcp/**'

secrets:
  - any-glob:
      - 'community/secrets/**'

pii:
  - any-glob:
      - 'community/pii/**'
