name: aegis-release
version: "1.0"
# GitForge is the build path of record for Aegis releases (manual
# trigger — a release is a deliberate act, not something every push
# should spend 30 minutes of lane time on). The image is built from
# ci/release/Dockerfile; its digest pin makes the toolchain of every
# release auditable.
trigger_on:
  - manual
environment: {}
jobs:
  - name: quality-gate
    image: localhost/aegis-release:20260910@sha256:e8459e041c91323fdc37a3d9c9483b2073ddadb91069a94312045b86695dda29
    timeout: 1200
    steps:
      - name: test-lint-fmt
        run: |
          set -eu
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo fmt --all -- --check
  - name: release-build
    image: localhost/aegis-release:20260910@sha256:e8459e041c91323fdc37a3d9c9483b2073ddadb91069a94312045b86695dda29
    timeout: 3600
    # Deliberately NOT `needs: [quality-gate]`: the orchestrator holds
    # DAG edges in memory only, so a mid-run restart orphans every
    # dependent job and the run wedges as a zombie (observed twice on
    # 2026-09-10). Flat jobs survive restarts — both rows exist at
    # trigger time and dispatch is database-driven. The gate-before-
    # build ordering is enforced where the artifacts meet the world:
    # publish_github_release.sh refuses to publish unless BOTH jobs of
    # this run reached `succeeded` in the lane database.
    steps:
      - name: build-package-attest
        run: bash scripts/release/build_release.sh
