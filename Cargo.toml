[package]
name = "aegis"
version.workspace = true
edition = "2021"
authors = ["Aegis Team"]
license = "Apache-2.0"
repository = "https://github.com/aegis/aegis"
description = "Aegis - Security scanning for DevOps and CI/CD"

[[bin]]
name = "aegis-bootstrap"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-cli",
    "crates/aegis-mcp",
    "crates/aegis-daemon",
    "crates/aegis-bundler",
    "crates/aegis-patterns",
    "crates/aegis-wasm",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Aegis Team"]
license = "Apache-2.0"
repository = "https://github.com/aegis/aegis"
rust-version = "1.75"

# Strict-but-practical lint baseline. Every member crate opts in with
# `[lints] workspace = true`; CI runs clippy with `-D warnings`, so all of
# these are errors in practice.
[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
let_underscore_drop = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_qualifications = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Throughput and score math intentionally narrows counters to f64; precision
# past the 52-bit mantissa is irrelevant for reported metrics.
cast_precision_loss = "allow"
# Backtick styling and function-length opinions are review concerns, not
# build gates.
doc_markdown = "allow"
too_many_lines = "allow"

[workspace.dependencies]
# Core dependencies
regex = "1.10"
regex-syntax = "0.8"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async
futures = "0.3"
async-trait = "0.1"

# Serialization
bincode = "1.3"
flate2 = "1.0"

# Hashing
sha2 = "0.11"
hex = "0.4"

# Error handling
miette = { version = "7.6", features = ["serde"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
colored = "3.1"
indicatif = "0.18"

# Utilities
walkdir = "2.5"
rayon = "1.10"
parking_lot = "0.12"
glob = "0.3"
ignore = "0.4"
similar = "3.1"
time = { version = "0.3", features = ["formatting"] }
env_logger = "0.11"
atty = "0.2"
dirs = "6.0"
serde_yaml = "0.9"
nix = "0.31"

# HTTP client (for bundle download)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# JSON Schema
jsonschema = "0.52"

# Property-based testing
proptest = "1.5"
criterion = { version = "0.8", features = ["html_reports"] }

# Test utilities
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
pretty_assertions = "1.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# The WASM artifact optimizes for download size, not speed. Profiles are
# only valid in the workspace root, so this lives here (a crate-level
# [profile.release] would be silently ignored).
[profile.release.package.aegis-wasm]
opt-level = "s"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package.aegis-core]
opt-level = 0

[package.metadata.cargo-machete]
ignored = ["lazy_static"]
