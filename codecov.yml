# Codecov configuration.
#
# Honest state (2026-09-24): uploads from CI fail with "Token required -
# not valid tokenless upload" because no CODECOV_TOKEN secret is set, so
# Codecov has never actually evaluated these targets. The gate that runs
# on every CI build is scripts/coverage-floor.sh, executed in the
# Coverage workflow against the same lcov report this file would see.
# Keep the two numbers in sync.
#
# The enforcing floor is pinned just below what the CI pipeline itself
# measures (`cargo llvm-cov --workspace --lcov`, 89.96% lines on
# 2026-09-24; the earlier ~97% figure came from `--all-targets`, which
# also counts the test sources executing themselves). Ratchet both up as
# measured coverage rises; never lower them to make a regression pass.
coverage:
  status:
    project:
      default:
        target: 89%
        threshold: 1%
    patch:
      default:
        target: 90%

ignore:
  - "crates/aegis-wasm"
  - "src/main.rs"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
