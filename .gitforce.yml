# GitForge CI pipeline (https://github.com/aliasfoxkde/GitForge).
#
# GitForge is this project's primary CI/CD platform: the release asset matrix
# is built here, then synced to the GitHub release by
# `scripts/release/publish.sh`. The GitHub `Release` workflow is a
# manual-dispatch fallback that runs the same scripts.
#
# ONE job, ordered steps. GitForge's deployed trigger path queues only the
# pipeline's first job with empty `needs` and never schedules dependents
# (gitforge-api webhook.rs), so any `needs`-based lane split silently
# degrades to "first job only" — the release build would never run. A single
# job makes every stage actually execute; the steps are ordered so a failure
# fails the job immediately.
#
# Runs in the aegis-builder image (scripts/release/Dockerfile) with the
# repository mounted at the working directory; the runner collects the job's
# `artifacts/` directory. Every cargo invocation passes --locked: a drifted
# Cargo.lock must fail the run instead of silently building a different
# dependency graph.
name: aegis-release
version: "1"
trigger_on: [manual, tag]
environment: {}
jobs:
  - name: gates-and-release
    image: aegis-builder:1
    timeout: 360m
    steps:
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: core tests
        run: cargo test --locked -p aegis-core --all-targets -- --test-threads=1
      - name: cli tests
        run: cargo test --locked -p aegis-cli --all-targets -- --test-threads=1
      - name: pattern tests
        run: cargo test --locked -p aegis-patterns --all-targets -- --test-threads=1
      - name: support crate tests
        run: cargo test --locked -p aegis-bundler -p aegis-daemon -p aegis-mcp -p aegis-wasm --all-targets -- --test-threads=1
      - name: build assets
        run: scripts/release/pipeline.sh
