name: Fuzz

on:
  schedule:
    # Weekly, off the hour to avoid the top-of-hour CI thundering herd.
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      seconds_per_target:
        description: 'Max seconds per fuzz target'
        required: false
        default: '120'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@98d24199e2a0e4c9619770c16072327a813b72f0 # cargo-fuzz

      - name: Fuzz suppression parser
        run: cargo fuzz run fuzz_suppression_parse -- -max_total_time=${{ github.event.inputs.seconds_per_target || '120' }}

      - name: Fuzz ignore-rule compiler
        run: cargo fuzz run fuzz_ignore_rules_compile -- -max_total_time=${{ github.event.inputs.seconds_per_target || '120' }}

      - name: Fuzz baseline parser
        run: cargo fuzz run fuzz_baseline_parse -- -max_total_time=${{ github.event.inputs.seconds_per_target || '120' }}

      - name: Fuzz user patterns config
        run: cargo fuzz run fuzz_user_patterns_config -- -max_total_time=${{ github.event.inputs.seconds_per_target || '120' }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
