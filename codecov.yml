# Codecov configuration.
#
# Honest state (2026-09-24): uploads from CI fail with "Token required -
# not valid tokenless upload" because no CODECOV_TOKEN secret is set, so
# Codecov has never actually evaluated these targets. The gate that runs
# on every CI build is scripts/coverage-floor.sh, executed in the
# Coverage workflow against the same lcov report this file would see.
# Keep the two numbers in sync.
#
# The enforcing floor is pinned just below what the CI pipeline itself
# measures: 97.61% lines over the counted set (`cargo llvm-cov
# --workspace --lcov`, Coverage job, 2026-09-24). Only the CI-generated
# report is authoritative for the floor — a locally generated report of
# the same command maps identical executed code to a different number
# of instrumented lines (aegis-core alone: 11,053 lines on CI vs
# 13,504 locally, with matching hit counts), so local numbers are not
# comparable to the gate. Ratchet both up as measured coverage rises;
# never lower them to make a regression pass.
coverage:
  status:
    project:
      default:
        target: 97%
        threshold: 1%
    patch:
      default:
        target: 90%

ignore:
  - "crates/aegis-wasm"
  - "src/main.rs"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
