# Labeler configuration
# https://github.com/actions/labeler

# Patterns
documentation:
  - changed-files:
      - any-glob: 'docs/**'
      - any-glob: '**.md'

ci-cd:
  - changed-files:
      - any-glob: '.github/workflows/**'
      - any-glob: '.github/*.yml'

detection-patterns:
  - changed-files:
      - any-glob: 'crates/aegis-patterns/**'

core:
  - changed-files:
      - any-glob: 'crates/aegis-core/**'

cli:
  - changed-files:
      - any-glob: 'crates/aegis-cli/**'

mcp:
  - changed-files:
      - any-glob: 'crates/aegis-mcp/**'

secrets:
  - changed-files:
      - any-glob: 'community/secrets/**'

pii:
  - changed-files:
      - any-glob: 'community/pii/**'
