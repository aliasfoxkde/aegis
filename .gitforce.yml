# GitForge CI pipeline (https://github.com/aliasfoxkde/GitForge).
#
# GitForge is this project's primary CI/CD platform: the release asset matrix
# is built here, then synced to the GitHub release by
# `scripts/release/publish.sh`. The GitHub `Release` workflow is a
# manual-dispatch fallback that runs the same scripts.
#
# ONE job, ordered steps. GitForge's deployed trigger path queues only the
# pipeline's first job with empty `needs` and never schedules dependents
# (gitforge-api webhook.rs), so any `needs`-based lane split silently
# degrades to "first job only" — the release build would never run. A single
# job makes every stage actually execute; the steps are ordered so a failure
# fails the job immediately.
#
# Runs in the aegis-builder image (scripts/release/Dockerfile) with the
# repository mounted at the working directory; the runner collects the job's
# `artifacts/` directory. Every cargo invocation passes --locked: a drifted
# Cargo.lock must fail the run instead of silently building a different
# dependency graph.
name: aegis-release
version: "1"
trigger_on: [manual, tag]
environment: {}
jobs:
  - name: gates-and-release
    image: aegis-builder:1
    timeout: 360m
    steps:
      # Every cargo invocation builds into CARGO_TARGET_DIR=/tmp/ci-target
      # (container-local disk), never /workspace/target. The job's working
      # directory lives on the runner's network-mounted workspace share, and
      # cargo's incremental target directory there is unreliable: one run
      # failed reading clippy.toml with EPERM, the next with E0786 "found
      # invalid metadata files" for freshly written dependency rlibs. This
      # mirrors GitForge's own pipeline, which pins the same variable on the
      # same runner for exactly this reason. The `build assets` step keeps
      # build.sh's target/ layout (the release build re-verification depends
      # on it) and only executes on tag runs.
      - name: format
        run: CARGO_TARGET_DIR=/tmp/ci-target cargo fmt --all -- --check
      - name: clippy
        run: CARGO_TARGET_DIR=/tmp/ci-target cargo clippy --locked --workspace --all-targets -- -D warnings
      # Test steps deliberately omit --all-targets: that selector runs bench
      # binaries too, and criterion rejects --test-threads ("unexpected
      # argument"), failing the step after every real test has passed.
      # Default `cargo test` runs unit + integration + doc tests.
      - name: core tests
        run: CARGO_TARGET_DIR=/tmp/ci-target cargo test --locked -p aegis-core -- --test-threads=1
      - name: cli tests
        run: CARGO_TARGET_DIR=/tmp/ci-target cargo test --locked -p aegis-cli -- --test-threads=1
      - name: pattern tests
        run: CARGO_TARGET_DIR=/tmp/ci-target cargo test --locked -p aegis-patterns -- --test-threads=1
      - name: support crate tests
        run: CARGO_TARGET_DIR=/tmp/ci-target cargo test --locked -p aegis-bundler -p aegis-daemon -p aegis-mcp -p aegis-wasm -- --test-threads=1
      - name: build assets
        run: scripts/release/pipeline.sh
