name: Bug Report
description: Report a bug to help us improve
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the bug in detail
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Aegis Version
      description: Run `aegis --version` to get the version
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output/Screenshots
      description: Include any relevant output or screenshots
