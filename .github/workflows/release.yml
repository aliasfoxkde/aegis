name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux build
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release
      - name: Package
        run: |
          tar -czf aegis-x86_64-unknown-linux-gnu.tar.gz -C target/release aegis
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-linux
          path: aegis-x86_64-unknown-linux-gnu.tar.gz

  # macOS x86_64
  macos-x86:
    name: macOS x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release
      - name: Package
        run: |
          tar -czf aegis-x86_64-apple-darwin.tar.gz -C target/release aegis
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-macos-x86
          path: aegis-x86_64-apple-darwin.tar.gz

  # macOS ARM64 (Apple Silicon)
  macos-arm:
    name: macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release --target aarch64-apple-darwin
      - name: Package
        run: |
          tar -czf aegis-aarch64-apple-darwin.tar.gz -C target/aarch64-apple-darwin/release aegis
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-macos-arm
          path: aegis-aarch64-apple-darwin.tar.gz

  # Windows x86_64
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release
      - name: Package
        shell: bash
        run: |
          tar -czf aegis-x86_64-pc-windows-gnu.tar.gz -C target/release aegis.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-windows
          path: aegis-x86_64-pc-windows-gnu.tar.gz

  # Create release with all assets
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [linux, macos-x86, macos-arm, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: 'aegis-*'
          merge-multiple: true
      - name: Display structure
        run: ls -la release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
