name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege by default: read-only token for every job unless a job
# elevates explicitly (only CodeQL does, for SARIF upload).
permissions:
  contents: read

# One run per ref; superseded PR runs cancel instead of queueing behind
# the run they would invalidate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: rust
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:rust"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  doc:
    name: Rustdoc
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The workspace [lints.rustdoc] table (broken/private intra-doc
      # links) makes this gate meaningful; -D warnings additionally
      # escalates any future rustdoc lint that rustc ships.
      - name: Build docs
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests
        run: cargo test --locked --workspace

  build:
    name: Build
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --locked --workspace --release

  feature-tree-sitter:
    name: Feature tree-sitter
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The optional grammars are user-selectable but no default lane
      # enables them, so a broken feature would merge silently. Compile it
      # and run its dedicated test module.
      - name: Check feature
        run: cargo check --locked -p aegis-core --features tree-sitter
      - name: Test feature
        run: cargo test --locked -p aegis-core --features tree-sitter tree_sitter_tests

  msrv:
    name: MSRV 1.88
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.88.0"
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Cargo.toml declares rust-version 1.88; this job makes the claim
      # real. Bumping the declared MSRV requires changing this job in the
      # same commit (docs/PLAN.md, "MSRV is declared but never enforced").
      - name: Check workspace on MSRV
        run: cargo check --locked --workspace

  machete:
    name: Unused Dependencies
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-machete
        uses: taiki-e/install-action@98d24199e2a0e4c9619770c16072327a813b72f0 # v2
        with:
          tool: cargo-machete
      - name: Run cargo-machete
        run: cargo machete

  links:
    name: Links
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Config (excludes, retries) lives in lychee.toml at the repo root.
      # Moving or renaming a linked doc must pass through here; bot-host
      # 403 exclusions are documented in that file, not inline.
      - name: Check links in README and docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress 'README.md' 'docs/**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: llvm-tools
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@98d24199e2a0e4c9619770c16072327a813b72f0 # v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      # The enforcing gate: Codecov uploads currently fail (no
      # CODECOV_TOKEN secret), so the codecov.yml targets are never
      # evaluated there. This step fails the build below the floor
      # instead. The floor tracks the CI-generated report (measured
      # 97.61% lines over the counted set on 2026-09-24); keep it in
      # sync with codecov.yml and ratchet both up as measured coverage
      # rises — never down to make a regression pass.
      - name: Enforce coverage floor
        run: scripts/coverage-floor.sh lcov.info 97.0
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false

  security:
    name: Security Audit
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@98d24199e2a0e4c9619770c16072327a813b72f0 # v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: |
          # Ignore known transitive dependency vulnerabilities from jsonrpc (unmaintained)
          # RUSTSEC-2024-0421: idna < 1.0.0 (via jsonrpc)
          # RUSTSEC-2026-0097: rand < 0.8.6 (via jsonrpc-pubsub)
          # Kept in lockstep with deny.toml [advisories].ignore.
          cargo audit --ignore RUSTSEC-2024-0421 --ignore RUSTSEC-2026-0097

  deny:
    name: Dependency Policy
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny
        uses: taiki-e/install-action@98d24199e2a0e4c9619770c16072327a813b72f0 # v2
        with:
          tool: cargo-deny
      - name: Check advisories, licenses, bans, sources
        run: cargo deny check
