name: Stale

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  issues: write

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-message: 'This issue has been marked stale due to inactivity. Please update or close.'
          close-issue-message: 'This issue has been closed due to inactivity.'
          stale-label: stale
          any-of-labels: 'enhancement,question'
