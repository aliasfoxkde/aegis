name: Release

# Releases are built by the GitForge pipeline (.gitforce.yml) and synced to
# GitHub by scripts/release/publish.sh. This workflow is the manual fallback:
# it runs the exact same scripts, so either path produces the same asset set.
# Tag-triggered builds were removed — a tag push must not race the GitForge
# pipeline to create the release first.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-gnu,wasm32-unknown-unknown
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cross toolchain
        # zig supplies the linker for every cross target (glibc, Mach-O,
        # windows-gnu); see scripts/release/Dockerfile for the pinned version.
        run: |
          pip install ziglang==0.16.0
          cargo install --locked cargo-zigbuild
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
      - name: Build release assets
        run: scripts/release/build.sh '${{ inputs.tag }}'
      - name: Publish to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release/publish.sh '${{ inputs.tag }}'
